<!doctype html>
<html lang="en">
  <head>
    <!-- BASIC -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- MOBILE -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- TITLE -->
    <title>
      Arbutus | Alternative Investment Research Platform
    </title>

    <!-- PRIMARY SEO -->
    <meta
      name="title"
      content="Arbutus | Alternative Investment Research Platform"
    />

    <meta
      name="description"
      content="Arbutus provides alternative investment research, financial intelligence, market analytics, newsletters, investment databases and advanced research tools."
    />

    <meta
      name="keywords"
      content="Arbutus, alternative investments, investment research, hedge funds, private equity, financial intelligence, market research, investment database, analytics"
    />

    <meta
      name="author"
      content="Arbutus"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- CANONICAL -->
    <link
      rel="canonical"
      href="https://www.markupdesigns.net/arbutus-web/"
    />

    <!-- FAVICON -->
    <link
      rel="icon"
      type="image/png"
      href="/arbutus-web/favicon.ico"
    />

    <!-- GOOGLE FONTS -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- OPEN GRAPH -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Arbutus | Alternative Investment Research Platform"
    />

    <meta
      property="og:description"
      content="Explore alternative investment opportunities, financial research, analytics and premium market intelligence with Arbutus."
    />

    <meta
      property="og:url"
      content="https://www.markupdesigns.net/arbutus-web/"
    />

    <meta
      property="og:image"
      content="https://www.markupdesigns.net/arbutus-web/seo/home-banner.jpg"
    />

    <meta
      property="og:site_name"
      content="Arbutus"
    />

    <!-- TWITTER -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Arbutus | Alternative Investment Research Platform"
    />

    <meta
      name="twitter:description"
      content="Premium investment research platform with analytics, newsletters and market intelligence."
    />

    <meta
      name="twitter:image"
      content="https://www.markupdesigns.net/arbutus-web/seo/home-banner.jpg"
    />

    <!-- THEME -->
    <meta
      name="theme-color"
      content="#000000"
    />

    <!-- APPLE -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black"
    />

    <!-- PERFORMANCE -->
    <link
      rel="dns-prefetch"
      href="//fonts.googleapis.com"
    />

    <link
      rel="dns-prefetch"
      href="//fonts.gstatic.com"
    />

    <!-- STRUCTURED DATA -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Arbutus",
        "url": "https://www.markupdesigns.net/arbutus-web/",
        "logo": "https://www.markupdesigns.net/arbutus-web/favicon.png",
        "description": "Alternative investment research and market intelligence platform.",
        "sameAs": []
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
